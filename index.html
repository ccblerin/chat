<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devorah Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #chatBox {
      margin-top: 20px;
      border: 1px solid #ddd;
      padding: 10px;
      height: 250px;
      overflow-y: auto;
      background: #fafafa;
    }
    .message {
      margin-bottom: 8px;
      padding: 6px;
      border-radius: 4px;
      background: #e9ecef;
    }
    .timestamp {
      font-size: 0.8em;
      color: #666;
      display: block;
      margin-top: 2px;
    }
    #messageInput {
      width: 80%;
      padding: 8px;
    }
    #sendBtn {
      width: 18%;
      padding: 8px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #sendBtn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Devorah Chat</h2>
    <input type="email" id="emailInput" placeholder="Email" />
    <input type="password" id="passwordInput" placeholder="Password" />
    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn">Log In</button>
    <div id="status"></div>

    <div id="chatSection" style="display:none;">
      <h3>Chat Room</h3>
      <div id="chatBox"></div>
      <div style="display:flex; gap:4px;">
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAIgxx7Z5VY2Gk3nwrA4SnP_PxZocMEyvc",
      authDomain: "devorah-chat.firebaseapp.com",
      projectId: "devorah-chat",
      storageBucket: "devorah-chat.appspot.com",
      messagingSenderId: "923103482101",
      appId: "1:923103482101:web:3de55ab01f5001c862b5bc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const signupBtn = document.getElementById("signupBtn");
    const loginBtn = document.getElementById("loginBtn");
    const sendBtn = document.getElementById("sendBtn");
    const statusDiv = document.getElementById("status");
    const chatSection = document.getElementById("chatSection");
    const chatBox = document.getElementById("chatBox");

    signupBtn.addEventListener("click", async () => {
      const email = document.getElementById("emailInput").value;
      const pass = document.getElementById("passwordInput").value;
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        statusDiv.textContent = "✅ Account created successfully!";
      } catch (err) {
        statusDiv.textContent = "❌ " + err.message;
        console.error(err);
      }
    });

    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("emailInput").value;
      const pass = document.getElementById("passwordInput").value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        statusDiv.textContent = "✅ Logged in successfully!";
      } catch (err) {
        statusDiv.textContent = "❌ " + err.message;
        console.error(err);
      }
    });

    // Load messages immediately so previous ones appear even before login
    loadMessages();

    onAuthStateChanged(auth, user => {
      chatSection.style.display = user ? "block" : "none";
    });

    async function loadMessages() {
      const q = query(collection(db, "messages"), orderBy("timestamp"));
      onSnapshot(q, snapshot => {
        chatBox.innerHTML = "";
        snapshot.forEach(doc => {
          const msg = doc.data();
          const div = document.createElement("div");
          div.classList.add("message");
          const time = msg.timestamp?.toDate().toLocaleString() || "";
          div.innerHTML = `<strong>${msg.email}</strong>: ${msg.text}<span class="timestamp">${time}</span>`;
          chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    sendBtn.addEventListener("click", async () => {
      const text = document.getElementById("messageInput").value.trim();
      if (!text) return;
      const user = auth.currentUser;
      if (!user) return alert("Please log in first.");
      await addDoc(collection(db, "messages"), {
        email: user.email,
        text,
        timestamp: serverTimestamp()
      });
      document.getElementById("messageInput").value = "";
    });
  </script>
</body>
</html>
