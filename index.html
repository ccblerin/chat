<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Devorah Chat Forum</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; }
  #loginScreen { display: flex; height: 100vh; align-items: center; justify-content: center; background: #1f2933; color: white; flex-direction: column; }
  #loginScreen input { padding: 10px; width: 250px; margin-bottom: 10px; border-radius: 4px; border: none; }
  #loginScreen button { padding: 10px 20px; border: none; background: #3eb0ef; color: white; border-radius: 4px; cursor: pointer; margin-bottom: 8px; }
  #forumWrapper { display: none; height: 100vh; }
  .sidebar { width: 260px; background: #1f2933; color: white; padding: 16px; overflow-y: auto; }
  .sidebar h2 { margin-bottom: 10px; }
  .topic-list li { list-style: none; padding: 10px; background: #323f4b; margin-bottom: 6px; border-radius: 4px; cursor: pointer; }
  .topic-list li.active { background: #52606d; }
  .chat-area { flex: 1; display: flex; flex-direction: column; background: white; }
  .chat-header { padding: 12px; border-bottom: 1px solid #ddd; background: #f9fafb; }
  .chat-messages { flex: 1; padding: 16px; overflow-y: auto; background: #f3f4f6; }
  .message { background: #e5e7eb; padding: 10px; border-radius: 6px; margin-bottom: 10px; max-width: 75%; }
  .meta { font-size: 11px; opacity: 0.7; margin-top: 4px; }
  .reply-btn { font-size: 12px; color: #3b82f6; cursor: pointer; margin-top: 4px; }
  .reply-box { margin-left: 20px; margin-top: 10px; padding-left: 10px; border-left: 2px solid #ccc; }
  .chat-input { padding: 10px; border-top: 1px solid #ddd; display: flex; gap: 8px; }
  .chat-input input { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
  .chat-input button { padding: 8px 16px; background: #10b981; border: none; color: white; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <h1>Devorah Chat Login</h1>
  <input id="emailInput" placeholder="Email">
  <input id="passwordInput" placeholder="Password" type="password">
  <button onclick="login()">Login</button>
  <button onclick="signup()">Sign Up</button>
  <button onclick="anonymousLogin()">Enter Anonymously</button>
</div>

<!-- FORUM -->
<div id="forumWrapper">
  <div class="sidebar">
    <h2>Topics</h2>
    <ul class="topic-list" id="topicList">
      <li class="active">General Chat</li>
      <li>Tech Talk</li>
      <li>Random</li>
    </ul>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <h2 id="currentTopicTitle">General Chat</h2>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input">
      <input id="chatInput" placeholder="Type a message">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { 
    getFirestore, collection, addDoc, query, where, onSnapshot, orderBy 
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import { 
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, 
    signInAnonymously, onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  /* 🔥 Your Firebase Config */
  const firebaseConfig = {
    apiKey: "AIzaSyAIgxx7Z5VY2Gk3nwrA4SnP_PxZocMEyvc",
    authDomain: "devorah-chat.firebaseapp.com",
    projectId: "devorah-chat",
    storageBucket: "devorah-chat.firebasestorage.app",
    messagingSenderId: "923103482101",
    appId: "1:923103482101:web:3de55ab01f5001c862b5bc"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth();

  let currentUser = null;
  let currentTopic = "General Chat";
  let replyTo = null;

  /* LOGIN */
  function login() {
    const email = document.getElementById("emailInput").value;
    const pass = document.getElementById("passwordInput").value;
    signInWithEmailAndPassword(auth, email, pass)
      .catch(err => alert(err.message));
  }

  function signup() {
    const email = document.getElementById("emailInput").value;
    const pass = document.getElementById("passwordInput").value;
    createUserWithEmailAndPassword(auth, email, pass)
      .catch(err => alert(err.message));
  }

  function anonymousLogin() {
    signInAnonymously(auth);
  }

  onAuthStateChanged(auth, user => {
    if (user) {
      currentUser = user;
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("forumWrapper").style.display = "flex";
      loadMessages();
    }
  });

  /* LOAD MESSAGES IN REAL TIME */
  function loadMessages() {
    const q = query(
      collection(db, "messages"),
      where("topic", "==", currentTopic),
      orderBy("time")
    );

    onSnapshot(q, snapshot => {
      const container = document.getElementById("chatMessages");
      container.innerHTML = "";
      snapshot.forEach(doc => {
        container.appendChild(renderMessage(doc.data()));
      });
    });
  }

  /* SEND MESSAGE */
  async function sendMessage() {
    const text = document.getElementById("chatInput").value.trim();
    if (!text) return;

    await addDoc(collection(db, "messages"), {
      topic: currentTopic,
      user: currentUser.email || "Anonymous",
      text,
      time: Date.now(),
      parent: replyTo
    });

    replyTo = null;
    document.getElementById("chatInput").placeholder = "Type a message";
    document.getElementById("chatInput").value = "";
  }

  /* RENDER MESSAGE */
  function renderMessage(msg) {
    const div = document.createElement("div");
    div.className = "message";

    div.innerHTML = `
      <div><strong>${msg.user}</strong>: ${msg.text}</div>
      <div class="meta">${new Date(msg.time).toLocaleString()}</div>
      <div class="reply-btn" onclick="prepareReply('${msg.time}')">Reply</div>
    `;

    return div;
  }

  /* REPLY */
  window.prepareReply = function(id) {
    replyTo = id;
    document.getElementById("chatInput").placeholder = "Replying...";
    document.getElementById("chatInput").focus();
  };

  /* SWITCH TOPIC */
  document.getElementById("topicList").addEventListener("click", e => {
    if (e.target.tagName === "LI") {
      document.querySelectorAll(".topic-list li").forEach(li => li.classList.remove("active"));
      e.target.classList.add("active");
      currentTopic = e.target.textContent;
      document.getElementById("currentTopicTitle").textContent = currentTopic;
      loadMessages();
    }
  });
</script>

</body>
</html>
